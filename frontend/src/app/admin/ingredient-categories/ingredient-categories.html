<section class="ingredient-categories">
  <h1>Kategorije namirnica</h1>
  <a routerLink="/admin">Nazad na administraciju</a>

  <form class="category-form" (ngSubmit)="saveCategory()">
    <label for="category-name">Naziv kategorije</label>
    <input id="category-name" name="categoryName" [(ngModel)]="name"
           (ngModelChange)="error = ''" required
           [attr.aria-invalid]="error ? 'true' : null"
           [attr.aria-describedby]="error ? 'category-error' : null">

    @if (error) {
      <p id="category-error" class="form-error" role="alert">{{ error }}</p>
    }

    <button type="submit">
      {{ editingCategory ? 'Sačuvaj izmenu' : 'Dodaj kategoriju' }}
    </button>

    @if (editingCategory) {
      <button type="button" (click)="resetForm()">Otkaži</button>
    }
  </form>

  <label for="category-search">Pretraga po nazivu</label>
  <input id="category-search" type="search" #searchInput [value]="search"
         (input)="changeSearch(searchInput.value)">

  <table>
    <thead>
      <tr>
        <th scope="col" [attr.aria-sort]="ascending ? 'ascending' : 'descending'">
          <button type="button" (click)="changeSort()">
            Naziv {{ ascending ? '↑' : '↓' }}
          </button>
        </th>
        <th scope="col">Radnje</th>
      </tr>
    </thead>
    <tbody>
      @for (category of visibleCategories; track category.id) {
        <tr>
          <td>{{ category.name }}</td>
          <td><button type="button" (click)="editCategory(category)">Izmeni</button></td>
        </tr>
      } @empty {
        <tr><td colspan="2">Nema rezultata.</td></tr>
      }
    </tbody>
  </table>

  <div class="pagination">
    <button type="button" (click)="page = page - 1" [disabled]="page === 1">
      Prethodna
    </button>
    <span>Strana {{ page }} od {{ pageCount }}</span>
    <button type="button" (click)="page = page + 1" [disabled]="page >= pageCount">
      Sledeća
    </button>
  </div>
</section>
